services:
  - type: web
    name: semantic-kg-diff-backend
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt && pip install -r requirements.txt"
    startCommand: "python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DISABLE_HEAVY_EMBEDDINGS
        value: "1"
      - key: GROQ_MODEL
        value: "qwen/qwen3.8-27b"
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
